<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A trumpet augmentation that turns an iPhone into part of the instrument.">
  <title>Trumpet Phone Augmentation — Totally Guapo</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3efe5;
      --muted: #a9a79f;
      --accent: #e9b95f;
      --surface: #11110f;
      --line: rgba(243, 239, 229, 0.16);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: #090908;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .project {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 72% 44%, rgba(177, 126, 42, 0.12), transparent 34%),
        linear-gradient(135deg, #141411 0%, #090908 62%);
    }

    .project::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to right, black, transparent 78%);
      opacity: 0.15;
    }

    .project__copy {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: clamp(1.5rem, 7vw, 7rem);
      width: min(31rem, calc(100% - 3rem));
      transform: translateY(-50%);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 1.25rem;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 9ch;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.3rem, 7.5vw, 7.5rem);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 0.86;
    }

    .intro {
      max-width: 31rem;
      margin: 1.75rem 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.3vw, 1.1rem);
      line-height: 1.65;
    }

    .viewer {
      position: absolute;
      inset: 0;
      cursor: grab;
      outline: none;
      touch-action: pan-y;
    }

    .viewer:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }

    .viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .viewer__hint {
      position: absolute;
      right: clamp(1.5rem, 4vw, 4rem);
      bottom: 2rem;
      z-index: 2;
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .viewer__hint::before {
      display: inline-block;
      width: 2.5rem;
      height: 1px;
      margin: 0 0.75rem 0.25rem 0;
      background: var(--accent);
      content: "";
    }

    .viewer__status {
      position: absolute;
      z-index: 3;
      inset: 50% auto auto 72%;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transform: translate(-50%, -50%);
      transition: opacity 300ms ease;
      pointer-events: none;
    }

    .viewer.is-ready .viewer__status { opacity: 0; }

    @media (max-width: 720px) {
      .project__copy {
        top: 2.5rem;
        transform: none;
      }

      h1 { font-size: clamp(3rem, 16vw, 5rem); }
      .intro { max-width: 25rem; }
      .viewer__status { inset: 67% auto auto 50%; }
      .viewer__hint { bottom: 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main>
    <section class="project" aria-labelledby="project-title">
      <div class="project__copy">
        <p class="eyebrow">Physical interface / prototype</p>
        <h1 id="project-title">Phone meets trumpet.</h1>
        <p class="intro">A modular augmentation that brings the phone into the instrument—without asking either object to stop being itself.</p>
      </div>

      <div
        class="viewer"
        id="trumpet-viewer"
        tabindex="0"
        role="img"
        aria-label="Interactive 3D model of a trumpet phone augmentation. Hover or focus to separate its components."
      >
        <p class="viewer__status" aria-live="polite">Loading model</p>
      </div>
      <p class="viewer__hint">Hover to explore</p>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

    const viewer = document.querySelector('#trumpet-viewer');
    const status = viewer.querySelector('.viewer__status');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    const clock = new THREE.Clock();
    const pointer = new THREE.Vector2();
    const targetPointer = new THREE.Vector2();
    const components = [];
    const modelRoot = new THREE.Group();
    let isActive = false;
    let explodedBounds = null;
    let explodedFitScale = 1;
    const assembledCenter = new THREE.Vector3();
    const explodedCenter = new THREE.Vector3();
    const displayedCenter = new THREE.Vector3();
    const assembledRotation = new THREE.Quaternion();
    const explodedRotation = new THREE.Quaternion();

    // Responsive exploded-state framing. Padding is measured per viewport edge.
    const VIEW_FIT = {
      padding: 0.13,
      animationSpeed: 6
    };

    // Exploded-view distances as fractions of the normalized model size.
    // These are applied in WORLD SPACE; with the current camera, +Y is visual up.
    const EXPLODE = {
      pinSkinUp: 0.55,
      pinUp: 0.36,
      pinPinUp: 0.19,
      phoneMeshUp: 0.42,
      skinSecuringPinSide: 0.14,
      pinholderDistance: 0.14,
      foamHolderTowardPhone: 0.17,
      middleValveUp: 0.05,
      lastValveUp: 0.10,
      pinHolderClearance: 0.01,
      yawDegrees: 40
    };

    const MOVING_VALVE_PARTS = new Set([
      'pin',
      'pinSkin',
      'foamHolder',
      'skinSecuringPin',
      'pinPin'
    ]);

    function getComponentKey(name) {
      const baseName = name.replace(/\.\d+$/, '').toLowerCase();

      if (baseName === 'pinskin') return 'pinSkin';
      if (baseName === 'pinpin') return 'pinPin';
      if (baseName === 'pin') return 'pin';
      if (baseName === 'skinsecuringpin') return 'skinSecuringPin';
      if (baseName === 'pinholder') return 'pinholder';
      if (baseName === 'foamholder') return 'foamHolder';
      if (baseName.includes('iphone-16-case')) return 'phoneMesh';
      return null;
    }

    function getValveIndex(name) {
      const suffix = name.match(/\.(\d+)$/);
      return suffix ? Number.parseInt(suffix[1], 10) : 0;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    viewer.prepend(renderer.domElement);
    scene.add(modelRoot);

    scene.add(new THREE.HemisphereLight(0xfff5df, 0x25283a, 2.4));
    const keyLight = new THREE.DirectionalLight(0xffd99a, 4.5);
    keyLight.position.set(4, 6, 5);
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x9db9ff, 3);
    rimLight.position.set(-5, 1, -4);
    scene.add(rimLight);

    function updateExplodedFitScale() {
      if (!explodedBounds) return;

      camera.updateMatrixWorld(true);
      const min = explodedBounds.min;
      const max = explodedBounds.max;
      const corners = [];

      for (const x of [min.x, max.x]) {
        for (const y of [min.y, max.y]) {
          for (const z of [min.z, max.z]) corners.push(new THREE.Vector3(x, y, z));
        }
      }

      // Project the complete exploded box through the actual perspective camera.
      // Binary search accounts for aspect ratio, view offsets, and box depth.
      const ndcLimit = 1 - VIEW_FIT.padding * 2;
      const fitsAtScale = (scale) => corners.every((corner) => {
        const projected = corner
          .clone()
          .sub(explodedCenter)
          .multiplyScalar(scale)
          .applyQuaternion(explodedRotation)
          .project(camera);
        return Math.abs(projected.x) <= ndcLimit && Math.abs(projected.y) <= ndcLimit;
      });

      let lower = 0;
      let upper = 1;
      for (let index = 0; index < 24; index += 1) {
        const candidate = (lower + upper) / 2;
        if (fitsAtScale(candidate)) lower = candidate;
        else upper = candidate;
      }
      explodedFitScale = lower;
    }

    function resize() {
      const { width, height } = viewer.getBoundingClientRect();
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      const mobile = width <= 720;
      camera.position.set(mobile ? 0 : 0.25, mobile ? 0.35 : 0.15, 6.5);
      camera.setViewOffset(width, height, mobile ? 0 : -width * 0.18, mobile ? -height * 0.15 : 0, width, height);
      camera.lookAt(0, 0, 0);
      updateExplodedFitScale();
    }

    new ResizeObserver(resize).observe(viewer);
    resize();

    new GLTFLoader().load(
      './websiteModel.glb',
      ({ scene: loadedModel }) => {
        modelRoot.add(loadedModel);
        assembledRotation.copy(modelRoot.quaternion);
        explodedRotation.copy(assembledRotation);
        loadedModel.updateMatrixWorld(true);

        const bounds = new THREE.Box3().setFromObject(loadedModel);
        const size = bounds.getSize(new THREE.Vector3());
        const modelScale = 3.3 / Math.max(size.x, size.y, size.z);
        loadedModel.scale.multiplyScalar(modelScale);
        loadedModel.updateMatrixWorld(true);

        // Re-center after scaling so this also works with off-origin exports.
        const scaledCenter = new THREE.Box3().setFromObject(loadedModel).getCenter(new THREE.Vector3());
        loadedModel.position.sub(scaledCenter);
        loadedModel.updateMatrixWorld(true);

        const componentMap = new Map();
        const normalizedBounds = new THREE.Box3().setFromObject(loadedModel);
        normalizedBounds.getCenter(assembledCenter);
        displayedCenter.copy(assembledCenter);
        const normalizedSize = normalizedBounds.getSize(new THREE.Vector3());
        const explosionScale = Math.max(normalizedSize.x, normalizedSize.y, normalizedSize.z);
        const worldUp = new THREE.Vector3(0, 1, 0);
        const stackDirection = worldUp.clone().normalize();
        const pinHolderDirection = new THREE.Vector3(0, 0, 1).normalize();
        const pinHolderBottomByValve = new Map();
        let phoneWorldPosition = null;

        // Use geometry centers rather than object origins: several authored parts
        // share an origin even though their visible geometry is far apart.
        loadedModel.traverse((object) => {
          if (object.isMesh && getComponentKey(object.name) === 'phoneMesh') {
            phoneWorldPosition = new THREE.Box3().setFromObject(object).getCenter(new THREE.Vector3());
          }
          if (object.isMesh && getComponentKey(object.name) === 'pinholder') {
            const holderBounds = new THREE.Box3().setFromObject(object);
            pinHolderBottomByValve.set(getValveIndex(object.name), holderBounds.min.y);
          }
        });

        // World Y is the remaining principal axis: it turns the assembly sideways
        // without rolling it in-plane or tipping it around the phone's long axis.
        explodedRotation
          .setFromAxisAngle(new THREE.Vector3(0, 1, 0), THREE.MathUtils.degToRad(EXPLODE.yawDegrees))
          .multiply(assembledRotation);

        loadedModel.traverse((object) => {
          if (!object.isMesh) return;

          // Names and userData keep every authored GLB component addressable.
          object.userData.componentName = object.name;
          object.userData.componentIndex = components.length;
          const componentKey = getComponentKey(object.name);
          const valveIndex = getValveIndex(object.name);
          const originalPosition = object.position.clone();
          const originalWorldPosition = object.getWorldPosition(new THREE.Vector3());
          const explodedPosition = originalPosition.clone();

          if (componentKey) {
            const worldOffset = new THREE.Vector3();

            if (componentKey === 'pinSkin') {
              worldOffset.addScaledVector(stackDirection, EXPLODE.pinSkinUp * explosionScale);
            } else if (componentKey === 'pin') {
              // Numbered pins use their valve-set lift as their complete upward
              // travel, keeping their lower edge beneath the stationary holder.
              const requestedPinDistance = valveIndex === 1
                ? EXPLODE.middleValveUp
                : valveIndex === 2
                  ? EXPLODE.lastValveUp
                  : EXPLODE.pinUp;
              let pinDistance = requestedPinDistance * explosionScale;

              if (valveIndex > 0) {
                const pinBottom = new THREE.Box3().setFromObject(object).min.y;
                const holderBottom = pinHolderBottomByValve.get(valveIndex);
                const maximumRise = holderBottom
                  - pinBottom
                  - EXPLODE.pinHolderClearance * explosionScale;
                pinDistance = Math.min(pinDistance, Math.max(0, maximumRise));
              }
              worldOffset.addScaledVector(stackDirection, pinDistance);
            } else if (componentKey === 'pinPin') {
              worldOffset.addScaledVector(stackDirection, EXPLODE.pinPinUp * explosionScale);
            } else if (componentKey === 'skinSecuringPin') {
              worldOffset.set(
                -EXPLODE.skinSecuringPinSide * explosionScale,
                EXPLODE.pinSkinUp * explosionScale,
                0
              );
            } else if (componentKey === 'pinholder') {
              worldOffset.addScaledVector(pinHolderDirection, EXPLODE.pinholderDistance * explosionScale);
            } else if (componentKey === 'foamHolder') {
              const foamWorldPosition = new THREE.Box3().setFromObject(object).getCenter(new THREE.Vector3());
              const towardPhone = phoneWorldPosition.clone().sub(foamWorldPosition);

              // Project out world-up so the phone-directed part stays lateral.
              towardPhone.addScaledVector(worldUp, -towardPhone.dot(worldUp)).normalize();
              worldOffset
                .addScaledVector(worldUp, EXPLODE.pinSkinUp * explosionScale)
                .addScaledVector(towardPhone, EXPLODE.foamHolderTowardPhone * explosionScale);
            } else if (componentKey === 'phoneMesh') {
              worldOffset.addScaledVector(worldUp, EXPLODE.phoneMeshUp * explosionScale);
            }

            // Lift each numbered valve as a five-part functional set. Its blue
            // pinHolder, the trumpet body, and phone mesh are intentionally fixed.
            if (componentKey !== 'pin' && MOVING_VALVE_PARTS.has(componentKey)) {
              const valveLift = valveIndex === 1
                ? EXPLODE.middleValveUp
                : valveIndex === 2
                  ? EXPLODE.lastValveUp
                  : 0;
              worldOffset.addScaledVector(stackDirection, valveLift * explosionScale);
            }

            const explodedWorldPosition = originalWorldPosition.clone().add(worldOffset);

            // Convert the desired world-space target through the full parent
            // transform (including the GLB root quaternion) into local space.
            explodedPosition.copy(object.parent.worldToLocal(explodedWorldPosition));

            // Temporary diagnostics for verifying the imported coordinate system.
            console.debug('[exploded-view]', {
              componentName: object.name,
              localPosition: originalPosition.toArray(),
              worldPosition: originalWorldPosition.toArray(),
              worldExplosionDirection: worldOffset.toArray()
            });
          }

          components.push({
            object,
            originalPosition,
            explodedPosition
          });
          componentMap.set(object.name, object);
        });

        // Measure the complete exploded assembly without showing that state.
        for (const component of components) {
          component.object.position.copy(component.explodedPosition);
        }
        loadedModel.updateMatrixWorld(true);
        explodedBounds = new THREE.Box3().setFromObject(loadedModel);
        explodedBounds.getCenter(explodedCenter);

        for (const component of components) {
          component.object.position.copy(component.originalPosition);
        }
        loadedModel.updateMatrixWorld(true);
        updateExplodedFitScale();

        // A public lookup for future per-component interactions or annotations.
        window.trumpetComponents = componentMap;

        viewer.classList.add('is-ready');
        status.textContent = 'Model loaded';
      },
      undefined,
      (error) => {
        console.error('Could not load the trumpet model:', error);
        status.textContent = '3D model unavailable';
      }
    );

    function setActive(active) {
      isActive = active;
      if (!active) targetPointer.set(0, 0);
    }

    viewer.addEventListener('pointerenter', () => setActive(true));
    viewer.addEventListener('pointerleave', () => setActive(false));
    viewer.addEventListener('focus', () => setActive(true));
    viewer.addEventListener('blur', () => setActive(false));
    viewer.addEventListener('pointermove', (event) => {
      const rect = viewer.getBoundingClientRect();
      targetPointer.set(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -((event.clientY - rect.top) / rect.height) * 2 + 1
      );
    });
    viewer.addEventListener('pointerdown', (event) => {
      if (event.pointerType !== 'mouse') setActive(!isActive);
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const smoothing = reducedMotion ? 1 : 1 - Math.exp(-delta * VIEW_FIT.animationSpeed);
      pointer.lerp(targetPointer, smoothing);

      for (const component of components) {
        component.object.position.lerp(
          isActive ? component.explodedPosition : component.originalPosition,
          smoothing
        );
      }

      modelRoot.quaternion.slerp(isActive ? explodedRotation : assembledRotation, smoothing);

      const targetScale = isActive ? explodedFitScale : 1;
      const uniformScale = THREE.MathUtils.lerp(modelRoot.scale.x, targetScale, smoothing);
      modelRoot.scale.setScalar(uniformScale);
      displayedCenter.lerp(isActive ? explodedCenter : assembledCenter, smoothing);

      // Scaling about the measured content center prevents the assembly drifting.
      modelRoot.position
        .copy(displayedCenter)
        .multiplyScalar(uniformScale)
        .applyQuaternion(modelRoot.quaternion)
        .negate();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
